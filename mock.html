<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Fabtek Materiali</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-navy:#0B2545;
    --brand-navy-deep:#061527;
    --accent:#B8752B;
    --accent-ink:#FFFFFF;
    --status-good:#2E7D4F;
    --status-good-bg:#E4F3EA;
    --status-warn:#A9660E;
    --status-warn-bg:#FBEEDD;
    --status-pending:#5B6472;
    --status-pending-bg:#EAECEF;

    --bg:#FFFFFF;
    --surface:#F5F8FB;
    --surface-2:#EAF0F6;
    --border:#DCE4EC;
    --ink:#16212E;
    --ink-soft:#5B6774;
    --ink-faint:#8894A1;
    --focus-ring:#4C7FD1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0F16;
      --surface:#11181F;
      --surface-2:#182029;
      --border:#293240;
      --ink:#E8EEF4;
      --ink-soft:#9FAAB6;
      --ink-faint:#6E7987;
      --status-good-bg:#123322;
      --status-warn-bg:#3A2A0F;
      --status-pending-bg:#232A33;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0F16;
    --surface:#11181F;
    --surface-2:#182029;
    --border:#293240;
    --ink:#E8EEF4;
    --ink-soft:#9FAAB6;
    --ink-faint:#6E7987;
    --status-good-bg:#123322;
    --status-warn-bg:#3A2A0F;
    --status-pending-bg:#232A33;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  h1,h2,h3{ font-family:"Oswald", "IBM Plex Sans", sans-serif; text-wrap:balance; margin:0; letter-spacing:.2px; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--focus-ring); outline-offset:2px; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  /* ---------- shell ---------- */
  .topbar{
    background:var(--brand-navy);
    color:#fff;
    padding:14px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand .mark{ width:30px; height:30px; flex:none; }
  .brand .word{ font-family:"Oswald"; font-weight:700; font-size:20px; letter-spacing:.5px; }
  .brand .tag{ font-size:11px; color:#9FB3D6; letter-spacing:.3px; }
  .topbar .spacer{ flex:1; }
  .userchip{ font-size:13px; color:#CFE0F5; }
  .rolebtn{
    display:flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:8px; padding:8px 12px; cursor:pointer;
    font-size:13px; font-weight:600;
  }
  .rolebtn:hover{ background:rgba(255,255,255,.16); }
  .rolebtn svg{ width:15px; height:15px; flex:none; }
  .cartbtn{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:8px; padding:8px 12px; cursor:pointer;
    font-size:13px; font-weight:500;
  }
  .cartbtn:hover{ background:rgba(255,255,255,.16); }
  .cartbtn .badge{
    background:var(--accent); color:var(--accent-ink);
    border-radius:999px; min-width:18px; height:18px; padding:0 5px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600;
  }

  .crumbbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:10px 24px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:13px;
  }
  .crumb{ color:var(--ink-soft); cursor:pointer; background:none; border:none; font:inherit; padding:2px 4px; border-radius:4px; }
  .crumb:hover{ color:var(--ink); text-decoration:underline; }
  .crumb.current{ color:var(--ink); font-weight:600; cursor:default; text-decoration:none; }
  .crumb-sep{ color:var(--ink-faint); }

  main{ max-width:1080px; margin:0 auto; padding:32px 24px 80px; }
  .screen{ animation:rise .28s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
  .pagetitle{ font-size:28px; margin-bottom:6px; }
  .pagesub{ color:var(--ink-soft); font-size:15px; margin:0 0 28px; max-width:60ch; }

  /* ---------- home tiles ---------- */
  .hero-greeting{ margin-bottom:28px; }
  .hero-greeting .hi{ font-size:14px; color:var(--ink-soft); margin-bottom:4px; }
  .home-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:18px;
  }
  .home-tile{
    position:relative; overflow:hidden;
    border:none; cursor:pointer; text-align:left;
    border-radius:14px; padding:0;
    height:190px;
    background:linear-gradient(150deg, var(--brand-navy) 0%, var(--brand-navy-deep) 100%);
    color:#fff;
  }
  .home-tile .glyph{
    position:absolute; right:-10px; bottom:-14px; width:130px; height:130px;
    color:rgba(255,255,255,.14);
  }
  .home-tile .content{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:20px; gap:6px; }
  .home-tile .num{ font-family:"IBM Plex Mono"; font-size:12px; color:var(--accent); letter-spacing:1px; }
  .home-tile .label{ font-family:"Oswald"; font-size:19px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; line-height:1.25; }
  .home-tile .desc{ font-size:12.5px; color:#C4D3E8; }
  .home-tile:hover{ box-shadow:0 10px 26px -10px rgba(0,0,0,.4); transform:translateY(-2px); }
  .home-tile{ transition:transform .15s ease, box-shadow .15s ease; }
  .home-tile:focus-visible{ outline-offset:3px; }

  /* ---------- tile grids (categorie/famiglie/item) ---------- */
  .tile-grid{ display:grid; gap:14px; }
  .tile-grid.cat{ grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); }
  .tile-grid.fam{ grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); }
  .tile-grid.items{ grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); }

  .tile{
    border:1px solid var(--border); background:var(--surface);
    border-radius:12px; cursor:pointer; text-align:left; padding:0; overflow:hidden;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    color:var(--ink);
  }
  .tile:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 20px -12px rgba(11,37,69,.35); }
  .tile .thumb{
    height:96px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--brand-navy) 0%, var(--brand-navy-deep) 100%);
    color:rgba(255,255,255,.9);
  }
  .tile .thumb svg{ width:44px; height:44px; }
  .tile .cap{ padding:12px 12px 14px; }
  .tile .cap .t{ font-weight:600; font-size:14px; line-height:1.3; }
  .tile .cap .s{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .tile.fam .thumb, .tile.item .thumb{ height:80px; }
  .tile.fam .thumb svg, .tile.item .thumb svg{ width:36px; height:36px; }

  .tile-wrap{ position:relative; }
  .tile-wrap .tile{ width:100%; }
  .tile-edit{
    position:absolute; top:8px; right:8px; z-index:2;
    width:28px; height:28px; border-radius:7px;
    border:1px solid rgba(255,255,255,.5); background:rgba(6,15,30,.55);
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .tile-edit:hover{ background:rgba(6,15,30,.85); }
  .tile-edit svg{ width:15px; height:15px; }
  .tile.tile-add{ border-style:dashed; }
  .tile .thumb.add{ background:var(--surface-2); color:var(--ink-soft); }
  .tile .thumb.add svg{ width:32px; height:32px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,15,30,.55);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:24px;
    max-width:440px; width:100%; box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
    animation:rise .2s ease both;
  }
  .modal-box .formcard{ max-width:none; margin-bottom:0; }
  .modal-box .actions{ margin-top:20px; }

  /* ---------- forms ---------- */
  .formcard{
    border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface);
    max-width:720px;
  }
  .formcard .fr{
    display:grid; grid-template-columns:220px 1fr;
    border-bottom:1px solid var(--border);
  }
  .formcard .fr:last-child{ border-bottom:none; }
  .formcard .fr:nth-child(odd){ background:var(--surface-2); }
  .formcard .fl{
    padding:14px 16px; font-weight:600; font-size:13.5px; color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .formcard .fl .req{ color:var(--accent); font-size:12px; }
  .formcard .fv{ padding:10px 16px; display:flex; align-items:center; }
  .formcard input[type="text"], .formcard input[type="password"], .formcard textarea, .formcard select{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px;
    background:var(--bg); color:var(--ink); font:inherit; font-size:14px;
  }
  .formcard textarea{ resize:vertical; min-height:44px; }
  .formcard .readonly{ color:var(--ink-soft); font-size:13.5px; font-style:italic; }

  .actions{ display:flex; gap:10px; margin-top:22px; align-items:center; flex-wrap:wrap; }
  .btn{
    font-weight:600; font-size:14px; border-radius:9px; padding:11px 18px;
    cursor:pointer; border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    transition:background .15s ease, color .15s ease, opacity .15s ease;
  }
  .btn:hover{ background:var(--ink); color:var(--bg); }
  .btn.primary{ border-color:var(--brand-navy); background:var(--brand-navy); color:#fff; }
  .btn.primary:hover{ background:var(--brand-navy-deep); border-color:var(--brand-navy-deep); }
  .btn.accent{ border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }
  .btn.accent:hover{ opacity:.9; background:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn:disabled:hover{ background:transparent; color:var(--ink); }
  .btn.small{ padding:7px 12px; font-size:12.5px; border-radius:7px; }
  .btn.ghost{ border-color:var(--border); color:var(--ink-soft); }
  .btn.ghost:hover{ background:var(--surface-2); color:var(--ink); }

  .hint{ font-size:12.5px; color:var(--ink-faint); margin-top:10px; }

  /* ---------- item detail table ---------- */
  .detailhead{ display:flex; gap:18px; align-items:flex-start; margin-bottom:22px; flex-wrap:wrap; }
  .detailhead .thumb{
    width:96px; height:96px; border-radius:12px; flex:none;
    background:linear-gradient(160deg, var(--brand-navy) 0%, var(--brand-navy-deep) 100%);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .detailhead .thumb svg{ width:48px; height:48px; }

  .tablewrap{ border:1px solid var(--border); border-radius:12px; overflow:auto; }
  table.variants{ border-collapse:collapse; width:100%; min-width:720px; }
  table.variants th{
    background:var(--brand-navy); color:#fff; text-align:left; font-size:12px;
    text-transform:uppercase; letter-spacing:.5px; padding:10px 12px; font-weight:600; white-space:nowrap;
  }
  table.variants td{ padding:11px 12px; font-size:13.5px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.variants tr:last-child td{ border-bottom:none; }
  table.variants tr:nth-child(even){ background:var(--surface); }
  .qtybox{ display:flex; align-items:center; gap:6px; }
  .stepbtn{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--bg);
    color:var(--ink); cursor:pointer; font-size:14px; line-height:1; flex:none;
  }
  .qtybox input{
    width:44px; text-align:center; border:1px solid var(--border); border-radius:6px; padding:5px 2px;
    background:var(--bg); color:var(--ink); font:inherit; flex:none;
  }
  .qtybox.warn input{ border-color:var(--status-warn); background:var(--status-warn-bg); color:var(--status-warn); }
  .evadibox{ display:flex; align-items:center; gap:6px; }
  .evadibox input{
    width:44px; text-align:center; border:1px solid var(--border); border-radius:6px; padding:5px 2px;
    background:var(--bg); color:var(--ink); font:inherit; flex:none;
  }
  .evadibox .btn{ flex:none; white-space:nowrap; }

  /* ---------- login ---------- */
  .login-screen{ min-height:56vh; display:flex; align-items:center; justify-content:center; }
  .login-card{ width:100%; max-width:400px; text-align:center; }
  .login-brand{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:20px; }
  .login-brand .mark{ width:44px; height:44px; }
  .login-word{ font-family:"Oswald","IBM Plex Sans",sans-serif; font-weight:700; font-size:22px; letter-spacing:1px; color:var(--ink); }
  .login-hint{ margin-top:18px; font-size:12.5px; color:var(--ink-faint); }
  .linklike{ background:none; border:none; padding:0; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; text-decoration:underline; }
  .linklike:hover{ opacity:.8; }

  /* ---------- status pills ---------- */
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.good{ background:var(--status-good-bg); color:var(--status-good); }
  .pill.warn{ background:var(--status-warn-bg); color:var(--status-warn); }
  .pill.pending{ background:var(--status-pending-bg); color:var(--status-pending); }
  .pill .dot{ width:6px; height:6px; border-radius:999px; background:currentColor; }

  /* ---------- cart / review ---------- */
  .reqmeta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
  .reqmeta .card{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface); }
  .reqmeta .card .k{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-faint); margin-bottom:4px; }
  .reqmeta .card .v{ font-size:14.5px; font-weight:600; }

  .cartline{
    display:flex; gap:14px; align-items:center; border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; background:var(--surface); margin-bottom:10px;
  }
  .cartline .info{ flex:1; min-width:0; }
  .cartline .t1{ font-weight:600; font-size:14px; }
  .cartline .t2{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .cartline .qty{ font-family:"IBM Plex Mono"; font-size:14px; font-weight:500; background:var(--surface-2); padding:5px 10px; border-radius:7px; }
  .cartline .rm{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:18px; line-height:1; padding:4px 6px; border-radius:6px; }
  .cartline .rm:hover{ color:#B5453D; background:var(--surface-2); }

  .empty{ border:1.5px dashed var(--border); border-radius:12px; padding:40px 20px; text-align:center; color:var(--ink-soft); }

  /* ---------- requests list ---------- */
  .reqrow{
    display:grid; grid-template-columns:120px 1fr 100px 140px 24px; gap:14px; align-items:center;
    padding:14px 16px; border:1px solid var(--border); border-radius:10px; background:var(--surface);
    margin-bottom:10px; cursor:pointer; transition:border-color .15s ease;
  }
  .reqrow:hover{ border-color:var(--accent); }
  .reqrow .id{ font-family:"IBM Plex Mono"; font-weight:600; font-size:13.5px; }
  .reqrow .proj{ font-size:13.5px; color:var(--ink-soft); }
  .reqrow .chev{ color:var(--ink-faint); }
  .reqhead{ display:grid; grid-template-columns:120px 1fr 100px 140px 24px; gap:14px; padding:0 16px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); }
  .reqrow.admin, .reqhead.admin{ grid-template-columns:120px 1fr 1fr 100px 140px 24px; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(0);
    background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:9px; font-size:13.5px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .confirm-wrap{ text-align:center; max-width:520px; margin:20px auto 0; }
  .confirm-badge{
    width:64px; height:64px; border-radius:50%; margin:0 auto 18px; background:var(--status-good-bg); color:var(--status-good);
    display:flex; align-items:center; justify-content:center;
  }
  .confirm-badge svg{ width:30px; height:30px; }

  footer.note{ text-align:center; padding:24px; color:var(--ink-faint); font-size:12px; }

  @media (max-width:640px){
    .topbar{ padding:12px 16px; }
    .brand .tag{ display:none; }
    .userchip{ display:none; }
    .rolebtn .rlabel{ display:none; }
    .rolebtn{ padding:8px 10px; }
    .cartbtn #cartlabel{ display:none; }
    .cartbtn{ padding:8px 10px; }
    main{ padding:22px 16px 64px; }
    .formcard .fr{ grid-template-columns:1fr; }
    .formcard .fl{ padding-bottom:6px; }
    .reqrow, .reqhead, .reqrow.admin, .reqhead.admin{ grid-template-columns:1fr 1fr; grid-auto-rows:auto; }
    .reqhead > span:nth-child(2), .reqhead > span:nth-child(5){ display:none; }
    .reqrow .proj, .reqrow .chev{ display:none; }
  }

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; top:0; left:0; width:100%; padding:24px; }
    .pr-head{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:3px solid #0B2545; padding-bottom:10px; margin-bottom:16px; }
    .pr-brand{ font-family:"Oswald",sans-serif; font-weight:700; font-size:22px; letter-spacing:1px; color:#0B2545; }
    .pr-title{ font-size:13px; color:#333; }
    table.pr-meta{ width:100%; border-collapse:collapse; margin-bottom:18px; font-size:12px; }
    table.pr-meta th{ text-align:left; background:#EAF0F6; padding:6px 8px; width:110px; font-weight:600; border:1px solid #ccc; }
    table.pr-meta td{ padding:6px 8px; border:1px solid #ccc; }
    table.pr-items{ width:100%; border-collapse:collapse; font-size:11.5px; }
    table.pr-items th{ background:#0B2545; color:#fff; text-align:left; padding:6px 8px; }
    table.pr-items td{ padding:6px 8px; border-bottom:1px solid #ccc; font-family:"IBM Plex Mono",monospace; }
    table.pr-items tr:nth-child(even){ background:#F5F8FB; }
    .pr-foot{ margin-top:16px; font-size:10px; color:#666; }
  }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand" onclick="goto('home')" role="button" tabindex="0" aria-label="Torna alla home">
    <svg class="mark" viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round">
      <path d="M20 4 L35 12 V28 L20 36 L5 28 V12 Z"/>
      <path d="M14 16 h12 M14 20 h9 M14 24 h6" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="word">FABTEK</div>
      <div class="tag">Richiesta Materiali</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="userchip" id="userchip"></div>
  <button class="rolebtn" id="rolebtn" onclick="logout()"></button>
  <button class="cartbtn" id="cartbtn" onclick="goto('cart')" style="display:none">
    <svg width="16" height="16" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="33" r="2"/><circle cx="27" cy="33" r="2"/><path d="M6 8 h5 l4 19 h15 l4-13 h-21"/></svg>
    <span id="cartlabel">Richiesta in corso</span>
    <span class="badge" id="cartbadge">0</span>
  </button>
</div>

<div class="crumbbar" id="crumbbar"></div>

<main id="main"></main>

<footer class="note">Prototipo cliccabile — nessun dato reale collegato · v0.1</footer>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>
<div id="printArea"></div>

<script>

const CONNECTIONS = ["Swagelok Tube Fitting","NPT Femmina","NPT Maschio","Flangiato"];

let __idSeq = 1;
function newKey(prefix){ return `${prefix}-x${__idSeq++}`; }

let CUSTOM_ITEMS = {}; // famKey -> array di item (materializzato al primo accesso, editabile da Admin)
function itemsForFamily(fam){
  if(!CUSTOM_ITEMS[fam.key]){
    CUSTOM_ITEMS[fam.key] = Array.from({length:10}, (_,i)=>({
      key:`${fam.key}-${i+1}`,
      label:`Item ${i+1}`,
      sub:fam.label,
      icon:fam.icon,
    }));
  }
  return CUSTOM_ITEMS[fam.key];
}
function variantsForItem(catKey, famKey, itemIdx){
  const seed = (catKey.length*7 + famKey.length*13 + itemIdx*5);
  const rows = [];
  for(let i=0;i<4;i++){
    const s = SIZES[(seed+i*2)%SIZES.length];
    const m = MATERIALS[(seed+i*3)%MATERIALS.length];
    const c = CONNECTIONS[(seed+i)%CONNECTIONS.length];
    const part = `${famKey.slice(0,3).toUpperCase()}-${(100+seed*3+i*7)%900+100}`;
    const avail = (seed*11 + i*23) % 36; // disponibilità a magazzino (mock)
    rows.push({part, size:s, material:m, connection:c, avail});
  }
  return rows;
}
function availPill(avail){
  if(avail<=0) return `<span class="pill warn"><span class="dot"></span>Esaurito</span>`;
  if(avail<6) return `<span class="pill warn"><span class="dot"></span>${avail} disponibili</span>`;
  return `<span class="pill good"><span class="dot"></span>${avail} disponibili</span>`;
}

}

function openFamily(famKey){ state.family = famKey; state.itemIdx=null; goto("items"); }
function openItem(idx){ state.itemIdx = idx; goto("itemdetail"); }

function addToCart(catKey, famKey, itemIdx, variant, qty){
  const cat = CATEGORIES.find(c=>c.key===catKey);
  const fam = FAMILIES.find(f=>f.key===famKey);
  const existing = state.cart.find(l=>l.part===variant.part);
  if(existing){ existing.qty += qty; }
  else {
    state.cart.push({
      catLabel:cat.label, famLabel:fam.label, famIcon:fam.icon, itemLabel:`Item ${itemIdx+1}`,
      part:variant.part, size:variant.size, material:variant.material, connection:variant.connection, qty,
    });
  }
  showToast(`Aggiunto: ${variant.part} × ${qty}`);
  renderCartBadge();
  refreshItemActions();
}
function removeFromCart(part){
  state.cart = state.cart.filter(l=>l.part!==part);
  render();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============================== render helpers ============================== */

function crumbBtn(label, screen, current){
  if(current) return `<span class="crumb current">${label}</span>`;
  return `<button class="crumb" onclick="goto('${screen}')">${label}</button>`;
}
function renderCrumbs(){
  const bar = document.getElementById("crumbbar");
  const parts = [];
  parts.push(crumbBtn("Home","home", state.screen==="home"));
  const flowLabel = state.flow==="crea" ? "Crea richiesta materiale"
                   : state.flow==="cerca" ? "Cerca info materiali"
                   : state.flow==="controlla" ? (state.role==="admin" ? "Gestisci le richieste" : "Controlla le tue richieste") : null;
  const flowScreen = state.flow==="crea" ? "form" : state.flow==="cerca" ? "searchform" : "requests";

  if(flowLabel){
    parts.push(`<span class="crumb-sep">›</span>`);
    const atFlowRoot = ["form","searchform","requests"].includes(state.screen);
    parts.push(crumbBtn(flowLabel, flowScreen, atFlowRoot));
  }
  if(state.category && ["families","items","itemdetail"].includes(state.screen)){
    const cat = CATEGORIES.find(c=>c.key===state.category);
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(crumbBtn(cat.label, "families", state.screen==="families"));
  }
  if(state.family && ["items","itemdetail"].includes(state.screen)){
    const fam = FAMILIES.find(f=>f.key===state.family);
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(crumbBtn(fam.label, "items", state.screen==="items"));
  }
  if(state.itemIdx!==null && state.screen==="itemdetail"){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(crumbBtn(`Item ${state.itemIdx+1}`, "itemdetail", true));
  }
  if(state.screen==="cart"){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(crumbBtn("Riepilogo richiesta","cart", true));
  }
  if(state.screen==="confirm"){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(crumbBtn("Richiesta inviata","confirm", true));
  }
  if(state.screen==="requestdetail"){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(crumbBtn(state.activeRequest ? state.activeRequest.id : "Dettaglio","requestdetail", true));
  }
  bar.innerHTML = parts.join("");
}

function renderCartBadge(){
  const btn = document.getElementById("cartbtn");
  const badge = document.getElementById("cartbadge");
  const label = document.getElementById("cartlabel");
  const n = state.cart.reduce((s,l)=>s+1,0);
  if(state.flow==="crea" && !["home","confirm"].includes(state.screen)){
    btn.style.display = "flex";
    badge.textContent = n;
    label.textContent = n===0 ? "Richiesta in corso" : `Richiesta in corso`;
  } else {
    btn.style.display = "none";
  }
}

function pillFor(key){
  const map = { evasa:["good","Evasa"], parziale:["warn","Evasa parziale"], prep:["pending","In preparazione"] };
  const [cls,label] = map[key] || ["pending", key];
  return `<span class="pill ${cls}"><span class="dot"></span>${label}</span>`;
}
function lineStatusKey(l){
  if(l.evaso<=0) return "prep";
  if(l.evaso<l.richiesto) return "parziale";
  return "evasa";
}
function requestStatusKey(r){
  const keys = r.lines.map(lineStatusKey);
  if(keys.every(k=>k==="evasa")) return "evasa";
  if(keys.some(k=>k==="evasa"||k==="parziale")) return "parziale";
  return "prep";
}

function doLogin(){
  const u = (document.getElementById("loginUser").value||"").trim().toLowerCase();
  const p = document.getElementById("loginPass").value||"";
  const rec = USERS[u];
  if(!rec || rec.password!==p){
    showToast("Credenziali non valide");
    return;
  }
  completeLogin(u);
}
function quickLogin(username){
  completeLogin(username);
}
function completeLogin(username){
  const rec = USERS[username];
  CURRENT_USER = rec.name;
  state.role = rec.role;
  state.form.richiedente = CURRENT_USER;
  showToast(`Benvenuto, ${CURRENT_USER}`);
  goto("home");
}
function logout(){
  state.screen = "login";
  state.flow = null;
  state.category = null;

  state.itemIdx = null;
  state.cart = [];

}

  openModal(`
    <div class="eyebrow">${editing?"Modifica categoria":"Nuova categoria"}</div>

function saveCategory(existingKey){
  const label = document.getElementById("mLabel").value.trim();
  const sub = document.getElementById("mSub").value.trim();
  if(!label){ showToast("Inserisci un nome"); return; }
  if(existingKey){

  } else {
    CATEGORIES.push({ key:newKey("cat"), label, sub, icon:"box" });

  closeModal(); render();

  const idx = CATEGORIES.findIndex(x=>x.key===existingKey);

function stepQty(i, delta, avail){
  const el = document.getElementById(`qty-${i}`);
  let v = parseInt(el.value||"0",10) + delta;
  if(v<0) v=0;
  el.value = v;
  checkQtyAvail(i, avail);
}
function checkQtyAvail(i, avail){
  const el = document.getElementById(`qty-${i}`);
  let v = parseInt(el.value||"0",10);
  if(isNaN(v) || v<0) v = 0;
  el.value = v;
  const box = document.getElementById(`qtybox-${i}`);
  if(box) box.classList.toggle("warn", v>avail);
}
function addVariantToCart(i){
  const cat = CATEGORIES.find(c=>c.key===state.category);
  const fam = FAMILIES.find(f=>f.key===state.family);
  const variants = variantsForItem(cat.key, fam.key, state.itemIdx);
  const v = variants[i];
  const qty = parseInt(document.getElementById(`qty-${i}`).value||"0",10);
  if(!qty || qty<=0){ showToast("Inserisci una quantità maggiore di zero"); return; }
  addToCart(cat.key, fam.key, state.itemIdx, v, qty);
}

function submitRequest(){
  const id = "RQ-" + (2032 + MOCK_REQUESTS.length);
  const lines = state.cart.map(l=>({
    desc: `${l.famLabel} — ${l.itemLabel}, misura ${l.size}`,
    part: l.part,
    richiesto: l.qty,
    evaso: 0,
  }));
  MOCK_REQUESTS.unshift({
    id, data: todayStr,
    progetto: state.form.progetto || "—",
    richiedente: state.form.richiedente || CURRENT_USER,
    lines,
  });
  state.lastRequestId = id;
  state.lastRequestCount = state.cart.length;
  state.cart = [];
  goto("confirm");
}

function evadiLinea(i){
  const r = state.activeRequest;
  const l = r.lines[i];
  const el = document.getElementById(`evline-${i}`);
  const remaining = l.richiesto - l.evaso;
  let q = parseInt(el.value||"0",10);
  if(isNaN(q) || q<=0){ showToast("Inserisci una quantità maggiore di zero"); return; }
  if(q>remaining) q = remaining;
  l.evaso += q;
  showToast(`Evaso ${q} × ${l.part}`);
  render();
}

/* ============================== dispatch ============================== */

function validateForm(){
  const f = state.form;
  const ok = f.richiedente && f.data && f.progetto && f.tool && f.utilities;
  const btn = document.getElementById("formNextBtn");
  if(btn) btn.disabled = !ok;
}

const SCREENS = {
  login: screenLogin,
  home: screenHome,
  form: screenForm,
  searchform: screenSearchForm,
  categories: screenCategories,
  families: screenFamilies,
  items: screenItems,
  itemdetail: screenItemDetail,
  cart: screenCart,
  confirm: screenConfirm,
  requests: screenRequests,
  requestdetail: screenRequestDetail,
};

function render(){
  document.getElementById("main").innerHTML = SCREENS[state.screen]();
  const isLogin = state.screen==="login";
  document.getElementById("topbar").style.display = isLogin ? "none" : "flex";
  document.getElementById("crumbbar").style.display = isLogin ? "none" : "flex";
  if(!isLogin){
    document.getElementById("userchip").textContent = `${CURRENT_USER} · ${state.role==="admin"?"Magazzino":"Richiedente"}`;
    renderRoleBtn();
    renderCrumbs();
    renderCartBadge();
  }
  if(state.screen==="form") validateForm();
  if(state.screen==="login"){
    const u = document.getElementById("loginUser");
    if(u) u.focus();
  }
}

render();
</script>
